# yaml-language-server: $schema=../space-setup-schema.json

version: 1

execution:
  mode: reconcile

inputs:
  space_name:
    description: "Name of the demo space to create"
    default: "Storyblok Customer Demo"

  frontend_host:
    description: "Frontend host used by the default preview URL"
    default: "storyblok-demo-default-se.netlify.app"

space:
  name: "${{ inputs.space_name }}"
  duplicate_from: "286863409930127"
  in_org: true
  demo: false
  readiness:
    timeout_seconds: 120
    poll_interval_seconds: 2

preview:
  enabled: true
  default: "https://${{ inputs.frontend_host }}/?token=${{ space.preview_token }}&path="
  environments:
    - name: "Local Development"
      url: "https://localhost:3000/?token=${{ space.preview_token }}&path="

demo_mode:
  remove: true

apps:
  continue_on_error: true
  install:
    - releases_only
    - storyblok-gmbh@ai-seo
    - replace_asset
    - export
    - import
    - backups
    - id: 29942

ai:
  enabled: true
  inherit_org_configuration: false

ai_translation:
  disclaimer_id: 173657768407244

components:
  fields:
    - component: article-page
      field: SEO
      type: custom
      field_type: sb-ai-seo
      tab: SEO

assets:
  upload_directory:
    - source: ./demo-assets
      target_folder: Provisioned
      include:
        - joyful-banner.png

stories:
  create:
    - name: Auto Created
      slug: auto-created
      content:
        component: default-page
        body:
          - component: hero-section
            eyebrow: "Provisioned by blokctl"
            layout: split
            text: "This story was automatically created by the provisioning system."
            image:
              asset:
                _find:
                  search: "joyful-banner.png"
                  in_folder: Provisioned
                  require_unique: true
                alt: "Automatically provisioned demo hero image"
            headline:
              - component: headline-segment
                text: "Automatically created by the provisioning system"

workflow:
  assign_unstaged: true
  stage_id: null
  assign:
    - stories:
        slugs:
          - home
          - about
          - auto-created
      workflow: Default
      stage: Reviewing

tags:
  - stories:
      slugs:
        - error-404
        - site-config
    tags:
      - Configuration

  - stories:
      slugs:
        - home
        - contact
    tags:
      - Landing
      - Marketing
