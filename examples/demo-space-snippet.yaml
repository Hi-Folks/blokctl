# Storyblok Demo Space as Code

version: 1

execution:
  mode: reconcile

inputs:
  customer:
    required: true
  frontend_host:
    default: "storyblok-demo.netlify.app"

space:
  name: "${{ inputs.customer }} Demo"
  duplicate_from: "286863409930127"
  in_org: true

preview:
  default: "https://${{ inputs.frontend_host }}/?token=${{ space.preview_token }}"
  environments:
    - name: "${{ inputs.customer }} Demo"
      url: "https://${{ inputs.frontend_host }}"

apps:
  install:
    - releases_only
    - storyblok-gmbh@ai-seo
    - backups

workflow:
  assign_unstaged: true
