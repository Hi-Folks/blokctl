# yaml-language-server: $schema=../space-setup-schema.json

version: 1

execution:
  mode: reconcile

folders:
  ensure:
    - name: Global
      slug: global
    - name: France
      slug: france
    - name: Spain
      slug: spain
    - name: Netherlands
      slug: netherlands
    - name: Norway
      slug: norway
    - name: Japan
      slug: japan

stories:
  move:
    - select:
        parent: root
        include_folders: true
        exclude_slugs:
          - "404"
          - error-404
          - site-config
          - global
          - france
          - spain
          - netherlands
          - norway
          - japan
      to_folder: global

apps:
  install:
    - slug: dimensions
      id: 24
    - id: 29942

ai:
  enabled: true
  inherit_org_configuration: false

ai_translation:
  disclaimer_id: 173657768407244

dimensions:
  enabled: true
  folders:
    - slug: global
    - slug: spain
      ai_translation_code: sp
    - slug: netherlands
      ai_translation_code: nl
    - slug: norway
      ai_translation_code: no
    - slug: japan
      ai_translation_code: jp
